version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: trustguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trustguard
      POSTGRES_PASSWORD: trustguard_dev_password
      POSTGRES_DB: trustguard
    ports:
      - "5432:5432"
    volumes:
      - trustguard_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trustguard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  trustguard_pg_data:
